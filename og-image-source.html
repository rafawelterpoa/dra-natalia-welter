<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Raleway:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;overflow:hidden;}
.wrap{width:1200px;height:630px;position:relative;overflow:hidden;background:#F0EAE0;}
.marble{position:absolute;inset:0;opacity:0.18;background:
  radial-gradient(ellipse 160% 80% at 5% 30%,rgba(137,107,69,0.5) 0%,transparent 55%),
  radial-gradient(ellipse 100% 50% at 90% 70%,rgba(137,107,69,0.4) 0%,transparent 50%),
  repeating-linear-gradient(128deg,transparent 0,transparent 48px,rgba(137,107,69,0.3) 48px,rgba(137,107,69,0.3) 49px),
  repeating-linear-gradient(38deg,transparent 0,transparent 72px,rgba(137,107,69,0.2) 72px,rgba(137,107,69,0.2) 73px);}
.photo-wrap{position:absolute;right:0;top:0;width:440px;height:630px;overflow:hidden;}
.photo-wrap::before{content:'';position:absolute;inset:0;background:linear-gradient(to right,#F0EAE0 0%,rgba(240,234,224,0.3) 35%,transparent 60%);z-index:2;}
.photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;}
.photo-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(240,234,224,0.5) 0%,transparent 30%);z-index:2;}
.photo-frame{position:absolute;top:24px;right:24px;bottom:24px;left:40px;border:1px solid rgba(137,107,69,0.3);z-index:3;}
.circle1{position:absolute;top:-100px;left:300px;width:600px;height:600px;border-radius:50%;border:1px solid rgba(137,107,69,0.1);}
.circle2{position:absolute;bottom:-120px;left:180px;width:400px;height:400px;border-radius:50%;border:1px solid rgba(137,107,69,0.08);}
.vline{position:absolute;left:72px;top:72px;width:1px;height:486px;background:rgba(137,107,69,0.2);}
.content{position:absolute;left:108px;top:72px;width:680px;bottom:72px;display:flex;flex-direction:column;justify-content:center;}
.logo-row{display:flex;align-items:center;gap:14px;margin-bottom:36px;}
.logo-row img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid rgba(137,107,69,0.3);}
.eyebrow{font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:0.22em;color:#896B45;text-transform:uppercase;font-weight:500;}
.name1{font-family:'Cormorant Garamond',Georgia,serif;font-size:78px;font-weight:300;line-height:1.0;color:#3A2C1E;margin-bottom:4px;}
.name2{font-family:'Cormorant Garamond',Georgia,serif;font-size:78px;font-weight:300;line-height:1.0;color:#896B45;font-style:italic;margin-bottom:30px;}
.divider{width:48px;height:1px;background:rgba(137,107,69,0.4);margin-bottom:24px;}
.spec{font-family:'Raleway',sans-serif;font-size:15px;letter-spacing:0.2em;color:#7A6A5A;text-transform:uppercase;font-weight:400;margin-bottom:8px;}
.cities{font-family:'Raleway',sans-serif;font-size:12px;letter-spacing:0.1em;color:rgba(137,107,69,0.6);margin-bottom:44px;}
.btn{display:inline-flex;align-items:center;gap:12px;background:#896B45;padding:14px 32px;}
.btn span{font-family:'Raleway',sans-serif;font-size:13px;letter-spacing:0.15em;color:#FDFAF6;text-transform:uppercase;font-weight:500;}
.footer{margin-top:36px;display:flex;gap:24px;align-items:center;}
.footer-url{font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:0.06em;color:rgba(137,107,69,0.5);}
.footer-sep{width:1px;height:12px;background:rgba(137,107,69,0.2);}
.footer-crm{font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:0.06em;color:rgba(137,107,69,0.4);}
</style>
</head>
<body>
<div class="wrap">
  <div class="marble"></div>
  <div class="photo-wrap">
    <img src="assets/images/foto-dra-natalia.jpg" alt=""/>
    <div class="photo-frame"></div>
  </div>
  <div class="circle1"></div>
  <div class="circle2"></div>
  <div class="vline"></div>
  <div class="content">
    <div class="logo-row">
      <img src="assets/images/logo-circular.jpg" alt=""/>
      <span class="eyebrow">Medicina com cuidado e excelência</span>
    </div>
    <div class="name1">Dra. Natália</div>
    <div class="name2">Welter</div>
    <div class="divider"></div>
    <div class="spec">Clínica Geral &amp; Endocrinologia</div>
    <div class="cities">Mafra/SC · Curitiba/PR · Sumaré/SP · Telemedicina</div>
    <div class="btn"><span>Agendar consulta</span><span style="color:rgba(253,250,246,0.7);font-size:14px;">→</span></div>
    <div class="footer">
      <span class="footer-url">www.dranataliawelter.com.br</span>
      <div class="footer-sep"></div>
      <span class="footer-crm">CRMSC 33871 · CRMPR 56567 · CREMESP 287181</span>
    </div>
  </div>
</div>
</body>
</html>
